[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-template"
version = "0.0.0"
description = "Plantilla para crear agentes de inteligencia artificial con FastAPI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Raúl Arroyo" }
]
requires-python = ">=3.13.1"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi~=0.124.4",
    "pydantic~=2.12.5",
    "pydantic-settings~=2.12.0",
    "starlette~=0.50.0",
    "uvicorn[standard]~=0.38.0",
]

[project.urls]
Homepage = "https://github.com/agent-template/agent-template"
Repository = "https://github.com/agent-template/agent-template"
Issues = "https://github.com/agent-template/agent-template/issues"

[project.scripts]
agent-template = "agent_template.main:main"

[dependency-groups]
dev = [
    "httpx~=0.28.0",
    "ruff~=0.14.9",
    "pip-audit>=2.7.0",
    "pyright~=1.1.390",
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG002", # unused method argument
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# select = ["N", "E4", "E7", "E9"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints",
    ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype",
    ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv"
]

[tool.ruff.lint.isort]
known-first-party = ["agent_template"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = false
reportUnusedVariable = true
reportDuplicateImport = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportTypedDictNotRequiredAccess = false
reportPrivateUsage = true
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
stubPath = "src"
extraPaths = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Improved options with coverage and logging
addopts = [
    "-ra",                     # mostrar summary con resultado
    "--strict-markers",        # strict checking de markers
    "--tb=short",              # traceback cortos y legibles
    "--strict-config",         # strict checking de config
    "--strict",                # todas las opciones strict
    "--cov=src",               # coverage por defecto
    "--cov-report=html",       # HTML report por defecto
    "--cov-report=term",       # terminal report
    "--cov-fail-under=80",     # fallar si coverage < 80%
    "--cov-branch",            # incluir cobertura de ramas
]

# Configuración asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Logging por defecto
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Markers para organización
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests between components",
    "e2e: End-to-end tests",
    "slow: Tests that take significant time to run",
    "network: Tests that require network access",
]

# Filtrado de warnings
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "def __str__",
    "def __unicode__",
    "@overload",
    "logger\\.",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
fail_under = 80
precision = 1
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"
title = "Agent Template Coverage Report"
skip_covered = true
skip_empty = true
show_contexts = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true
show_contexts = false
